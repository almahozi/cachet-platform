name: Deploy Cachet
on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Fetch parameters from SSM
        run: |
          DB_HOST=$(aws ssm get-parameter \
            --name "/cachet/prod/DB_HOST" \
            --query "Parameter.Value" \
            --output text)
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV

      - name: Deploy to EC2
        run: |
          # Dynamically find the instance ID using the Name tag
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=cachet-app-server" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          # Check if instance was found
          if [ "$INSTANCE_ID" == "None" ]; then
            echo "Error: Could not find a running instance with tag Name=cachet-app-server"
            exit 1
          fi

          echo "Deploying to instance: $INSTANCE_ID"

          # Trigger the deployment
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=$INSTANCE_ID" \
            --parameters 'commands=[
                "DB_HOST=$(aws ssm get-parameter --name /cachet/prod/DB_HOST --query Parameter.Value --output text)",
                "APP_KEY=${{ secrets.APP_KEY }}",
                "echo DB_HOST=$DB_HOST > /opt/cachet/.env",
                "echo APP_KEY=$APP_KEY >> /opt/cachet/.env",
                "curl -o /opt/cachet/docker-compose.yml https://raw.githubusercontent.com/almahozi/cachet-platform/master/docker-compose.yml",
                "cd /opt/cachet && docker-compose pull && docker-compose up -d"
              ]'